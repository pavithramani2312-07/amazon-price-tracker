name: Amazon Price Tracker

on:
  schedule:
    - cron: '0 */3 * * *'   # Every 3 hours (UTC)
  workflow_dispatch:

jobs:
  run-price-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Project
        run: ./gradlew clean jar

      - name: Run Price Tracker
        run: java -jar build/libs/amazon-price-tracker-1.0-SNAPSHOT.jar

      - name: Upload Debug HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-debug
          path: amazon_debug.html